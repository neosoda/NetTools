  <g font-size="10" fill="#9bb5c7" text-anchor="middle"><text x="1006" y="407">DISCOVER</text><text x="1092" y="407">ORGANIZE</text><text x="1179" y="407">BACK UP</text><text x="1268" y="407">REVIEW</text></g>
 </g>
