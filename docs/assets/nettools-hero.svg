<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc">
<title id="title">NetTools — Network operations, simplified</title>
<desc id="desc">Bannière graphique de NetTools : découverte, inventaire, sauvegarde et audit réseau. Illustration conceptuelle, pas une capture de l'application.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081327"/><stop offset=".56" stop-color="#0d1c36"/><stop offset="1" stop-color="#122e43"/></linearGradient>
  <radialGradient id="glow" cx="76%" cy="40%" r="62%"><stop stop-color="#1d9baf" stop-opacity=".21"/><stop offset="1" stop-color="#1d9baf" stop-opacity="0"/></radialGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#56e3d5"/><stop offset="1" stop-color="#72aaff"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#152840"/><stop offset="1" stop-color="#0d1b30"/></linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#7ba0c1" stroke-opacity=".08" stroke-width="1"/></pattern>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#000610" flood-opacity=".48"/></filter>
</defs>
<rect width="1400" height="520" rx="28" fill="url(#bg)"/>
<rect width="1400" height="520" rx="28" fill="url(#grid)"/>
<rect width="1400" height="520" rx="28" fill="url(#glow)"/>
<circle cx="1170" cy="60" r="220" fill="#48b7c8" opacity=".045"/>
<circle cx="1040" cy="430" r="330" fill="none" stroke="#65e2d6" stroke-opacity=".09" stroke-width="1"/>
<path d="M0 470Q390 350 690 500" stroke="#4ed3d7" stroke-opacity=".09" stroke-width="2" fill="none"/>
<!-- Brand mark -->
<g transform="translate(74 71)">
 <rect width="48" height="48" rx="14" fill="#193c50" stroke="#60dbd3" stroke-opacity=".55"/>
 <path d="M12 32V16l12 16V16M30 16h7a6 6 0 0 1 0 12h-7V16z" fill="none" stroke="#6de9db" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
 <text x="65" y="19" fill="#b9e7e7" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="4">NETWORK OPERATIONS</text>
 <text x="65" y="39" fill="#7497ad" font-family="Segoe UI,Arial,sans-serif" font-size="12" letter-spacing="2">A DESKTOP WORKSPACE FOR ADMINS</text>
</g>
<text x="72" y="238" fill="#ffffff" font-family="Segoe UI,Arial,sans-serif" font-size="104" font-weight="800" letter-spacing="-4">Net<tspan fill="url(#accent)">Tools</tspan></text>
<text x="76" y="291" fill="#e7f4ff" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="600">Votre réseau. Une vision claire.</text>
<text x="76" y="332" fill="#a8c1d3" font-family="Segoe UI,Arial,sans-serif" font-size="19">Découvrir, organiser, sauvegarder, auditer.</text>
<text x="76" y="361" fill="#a8c1d3" font-family="Segoe UI,Arial,sans-serif" font-size="19">Sans cloud imposé. Sans complexité inutile.</text>
<g font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="1">
 <rect x="76" y="411" width="161" height="42" rx="21" fill="#17394b" stroke="#4fceca" stroke-opacity=".55"/>
