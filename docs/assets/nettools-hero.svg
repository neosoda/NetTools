 <rect x="249" y="411" width="130" height="42" rx="21" fill="#19324b" stroke="#78aaff" stroke-opacity=".4"/>
 <text x="314" y="437" fill="#c0d9ff" text-anchor="middle">SSH BACKUP</text>
 <rect x="392" y="411" width="159" height="42" rx="21" fill="#19324b" stroke="#78aaff" stroke-opacity=".4"/>
 <text x="471" y="437" fill="#c0d9ff" text-anchor="middle">CONFIG AUDIT</text>
</g>
